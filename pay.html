<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure checkout · Elevated Listing</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://elevatedlisting.co/checkout/" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <script>
    (function () {
      var h = (location.hash || "").replace("#", "").toLowerCase();
      var plan = (h === "standard" || h === "elevated") ? h : "";
      location.replace("/checkout/" + (plan ? ("?plan=" + encodeURIComponent(plan)) : ""));
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/checkout/" />
</head>
<body>
  <p>Continue to <a href="/checkout/">secure checkout</a>.</p>
