<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure checkout with MoonPay — coming soon · Elevated Listing</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://elevatedlisting.co/checkout-coming-soon/" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <script>
    (function () {
      var h = (location.hash || "").replace("#", "").toLowerCase();
      var params = new URLSearchParams(location.search);
      var plan = params.get("plan") || "";
      if (!plan && (h === "standard" || h === "elevated")) plan = h;
      var dest = "/checkout-coming-soon/" + (plan ? ("?plan=" + encodeURIComponent(plan)) : "");
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Continue to <a href="/checkout-coming-soon/">secure checkout</a>.</p>
